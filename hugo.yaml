baseURL: https://jpgomz.github.io/
languageCode: es
title: JP Gomez - Software Engineer
theme: ["github.com/adityatelange/hugo-PaperMod"]

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: JP Gomez
  description: "Portafolio personal de ingeniería de software. Proyectos open source, artículos técnicos, Linux, backend, DevOps y desarrollo asistido por IA."
  keywords: [Blog, Portfolio, Software Engineering, Linux, Backend, DevOps, AI]
  author: JP Gomez

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  homeInfoParams:
    Title: "Hola, soy JP 👋"
    Content: >
      Ingeniero de software apasionado por el código abierto, Linux, backend, DevOps 
      y el desarrollo asistido por IA. Este sitio documenta mi trabajo y comparte conocimientos.

  socialIcons:
    - name: github
      url: "https://github.com/jpgomz"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
